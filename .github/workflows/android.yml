name: Android (Capacitor)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# attaching the builds to a GitHub release (on a v* tag) needs write access to the repository contents
permissions:
  contents: write

jobs:
  apk:
    name: APK (debug + release)
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KLADKA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Build web bundle and sync into the Android project
        run: |
          pnpm build:web
          pnpm --filter @kladka/app exec cap sync android
      - name: Decode signing key (only if secrets are configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KLADKA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Gradle assemble
        working-directory: apps/app/android
        env:
          KLADKA_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KLADKA_KEYSTORE_PASSWORD: ${{ secrets.KLADKA_KEYSTORE_PASSWORD }}
          KLADKA_KEY_ALIAS: ${{ secrets.KLADKA_KEY_ALIAS }}
          KLADKA_KEY_PASSWORD: ${{ secrets.KLADKA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            apps/app/android/app/build/outputs/apk/debug/*.apk
            apps/app/android/app/build/outputs/apk/release/*.apk
            apps/app/android/app/build/outputs/bundle/release/*.aab
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/app/android/app/build/outputs/apk/release/*.apk
            apps/app/android/app/build/outputs/bundle/release/*.aab
