name: Desktop (Tauri)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# attaching the builds to a GitHub release (on a v* tag) needs write access to the repository contents
permissions:
  contents: write

jobs:
  tauri:
    name: Tauri ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build desktop bundles
        working-directory: apps/app
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            apps/app/src-tauri/target/**/release/bundle/**/*.msi
            apps/app/src-tauri/target/**/release/bundle/**/*.exe
            apps/app/src-tauri/target/**/release/bundle/**/*.deb
            apps/app/src-tauri/target/**/release/bundle/**/*.rpm
            apps/app/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/app/src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: warn
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Кладка ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            apps/app/src-tauri/target/**/release/bundle/**/*.msi
            apps/app/src-tauri/target/**/release/bundle/**/*.exe
            apps/app/src-tauri/target/**/release/bundle/**/*.deb
            apps/app/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/app/src-tauri/target/**/release/bundle/**/*.dmg
